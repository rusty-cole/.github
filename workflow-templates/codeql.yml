name: CodeQL

# Ported from openclaw/openclaw .github/workflows/codeql.yml.
# Made repository-neutral: the OpenClaw original runs a seven-way matrix of custom CodeQL
# configs from .github/codeql/*.yml against openclaw-specific boundary queries, plus a huge
# path filter naming openclaw extensions. None of that transfers. This version keeps the
# shape (pull request, push to main, and a nightly schedule, with security-events upload)
# and uses the default query suite over autodetected languages.
#
# Set the repository variable CODEQL_LANGUAGES_JSON to match the repository. It is a JSON
# array of CodeQL language identifiers, because it feeds a matrix directly:
#   ["python"]                            for plane-runner
#   ["python","javascript-typescript"]    for a mixed repository
# It defaults to ["python"]. A plain comma separated list will not work here.
#
# CodeQL on a private repository requires GitHub Advanced Security. On a user-owned private
# repository without it, this workflow fails at the upload step. Either make the repository
# public, enable Advanced Security, or do not adopt this template. The OpenGrep template is
# the no-Advanced-Security alternative.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(vars.CODEQL_LANGUAGES_JSON || '["python"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
