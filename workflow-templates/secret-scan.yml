name: Secret Scan

# Implements Plane item SETUP-18: run a secret scanner on the pushed branch, and let a hit
# stop the item before any verifier runs. This workflow has no OpenClaw ancestor; it is new.
#
# The runner treats a failure here as Rework Required and must not start verification.
# Keep this in the required checks list for any repository with merge_enabled true.
#
# gitleaks-action v3 requires GITLEAKS_LICENSE for organization-owned repositories.
# rusty-cole is a user account, so no license key is needed today. If these repositories
# ever move under an organization, add the GITLEAKS_LICENSE secret or this check starts failing.

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the commit range, so a shallow checkout would miss
          # a secret introduced in an earlier commit on the same branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 30
