name: Workflow Sanity

# Ported from openclaw/openclaw .github/workflows/workflow-sanity.yml.
# Made repository-neutral: the OpenClaw git-owner action, the trusted base config fetch,
# pre-commit, and zizmor lanes were dropped because they depend on openclaw/openclaw
# internals and repository config files. What is kept runs on any repository with no
# setup: a tab check, actionlint, and an unpinned-action check.
#
# The unpinned-action check is not in the OpenClaw original. It is added here because
# "every action pinned by commit SHA" is a standing rule for these repositories, and a
# rule with no check is a rule that decays.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-tabs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail on tabs in workflow files
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import pathlib
          import sys

          root = pathlib.Path(".github/workflows")
          bad: list[str] = []
          if root.exists():
            for pattern in ("*.yml", "*.yaml"):
              for path in sorted(root.rglob(pattern)):
                if b"\t" in path.read_bytes():
                  bad.append(str(path))

          if bad:
            print("Tabs found in workflow file(s):")
            for path in bad:
              print(f"- {path}")
            sys.exit(1)
          print("No tabs found in workflow files.")
          PY

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run actionlint
        run: |
          set -euo pipefail
          # actionlint ships a single static binary. Pin the version so a new release
          # cannot turn a green branch red without a commit that says so.
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 120 \
            -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  pinned-actions:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail on actions not pinned by commit SHA
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import pathlib
          import re
          import sys

          # Matches: uses: owner/repo[/path]@ref   (local ./ references are exempt)
          uses_pattern = re.compile(r"^\s*(?:-\s*)?uses:\s*([^\s#]+)")
          sha_pattern = re.compile(r"^[0-9a-f]{40}$")

          bad: list[str] = []
          roots = [pathlib.Path(".github/workflows"), pathlib.Path(".github/actions")]
          for root in roots:
            if not root.exists():
              continue
            for pattern in ("*.yml", "*.yaml"):
              for path in sorted(root.rglob(pattern)):
                for number, line in enumerate(path.read_text().splitlines(), start=1):
                  match = uses_pattern.match(line)
                  if not match:
                    continue
                  reference = match.group(1)
                  if reference.startswith("./") or reference.startswith("docker://"):
                    continue
                  if "@" not in reference:
                    bad.append(f"{path}:{number}: {reference} has no ref")
                    continue
                  ref = reference.rsplit("@", 1)[1]
                  if not sha_pattern.match(ref):
                    bad.append(f"{path}:{number}: {reference} is not pinned to a 40 character commit SHA")

          if bad:
            print("Actions must be pinned by commit SHA:")
            for entry in bad:
              print(f"- {entry}")
            sys.exit(1)
          print("Every action reference is pinned by commit SHA.")
          PY
