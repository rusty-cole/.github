name: Dependency Guard

# Ported from openclaw/openclaw .github/workflows/dependency-guard.yml.
# Made repository-neutral: the OpenClaw original ran scripts/github/dependency-guard.mjs in
# three modes (detect, autoscrub, enforce) against an openclaw-secops team and a hardcoded
# approver list. None of that exists here. The autoscrub lane is dropped outright: it
# force-edits a contributor's branch, which is not a behavior to inherit without asking.
#
# What is kept is the intent: a dependency or lockfile change is not an ordinary diff, and it
# must be visible as its own check. This version uses the first-party dependency review
# action and additionally fails when a lockfile moves without its manifest.
#
# pull_request is used, not pull_request_target: this job needs no secrets, so there is no
# reason to give it a privileged context.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependency-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  lockfile-guard:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail when a lockfile moves without its manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"

          fail=0
          check_pair() {
            lockfile="$1"
            manifest="$2"
            if echo "$changed" | grep -qxF "$lockfile"; then
              if ! echo "$changed" | grep -qxF "$manifest"; then
                echo "::error file=$lockfile::$lockfile changed but $manifest did not. A lockfile should move because its manifest moved."
                fail=1
              fi
            fi
          }

          check_pair "package-lock.json" "package.json"
          check_pair "pnpm-lock.yaml" "package.json"
          check_pair "yarn.lock" "package.json"
          check_pair "poetry.lock" "pyproject.toml"
          check_pair "uv.lock" "pyproject.toml"
          check_pair "Cargo.lock" "Cargo.toml"
          check_pair "go.sum" "go.mod"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Lockfile guard passed."
