name: PR CI Sweeper

# Ported from openclaw/openclaw .github/workflows/pr-ci-sweeper.yml.
# Made repository-neutral: the OpenClaw original delegated to
# scripts/github/pr-ci-sweeper.mjs, which does not exist here. The inline replacement does
# the conservative half of that job: find open pull requests whose head commit has no
# check runs and no commit status at all, and report them in the run summary.
#
# It deliberately does NOT close and reopen pull requests, and does not rerun workflows.
# Both are write actions on someone else's branch, and the OpenClaw version needed
# actions:write plus a close/reopen cycle to re-fire CI. Reporting first is the safe
# starting point. See github-layer-spec.md for the conditions to meet before turning on
# automatic repair.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: pr-ci-sweeper
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    permissions:
      contents: read
      pull-requests: read
      checks: read
    runs-on: ubuntu-24.04
    steps:
      - name: Report pull requests with no checks on their head commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const dropped = [];
            for (const pull of pulls) {
              if (pull.draft) {
                continue;
              }
              const sha = pull.head.sha;
              const checks = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 1,
              });
              if (checks.data.total_count > 0) {
                continue;
              }
              const status = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 1,
              });
              if (status.data.total_count > 0) {
                continue;
              }
              dropped.push(pull);
            }

            if (dropped.length === 0) {
              core.info("Every open pull request has at least one check or status on its head commit.");
              await core.summary.addHeading("PR CI Sweeper").addRaw("No dropped CI found.").write();
              return;
            }

            const rows = [
              [
                { data: "Pull request", header: true },
                { data: "Head commit", header: true },
                { data: "Updated", header: true },
              ],
            ];
            for (const pull of dropped) {
              const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${pull.head.sha}`;
              rows.push([
                `<a href="${pull.html_url}">#${pull.number}</a>`,
                `<a href="${commitUrl}">${pull.head.sha.slice(0, 12)}</a>`,
                pull.updated_at,
              ]);
              core.warning(`Pull request #${pull.number} has no checks on ${pull.head.sha}: ${pull.html_url}`);
            }

            await core.summary
              .addHeading("PR CI Sweeper")
              .addRaw(`${dropped.length} open pull request(s) have no checks on their head commit.`)
              .addTable(rows)
              .write();
