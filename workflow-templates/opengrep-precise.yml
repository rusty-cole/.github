name: OpenGrep

# Ported from openclaw/openclaw .github/workflows/opengrep-precise.yml.
# Made repository-neutral: the OpenClaw original scoped the scan to a changed-paths diff
# using scripts/lib/merge-head-diff-base.mjs, scripts/run-opengrep.sh, and
# scripts/opengrep-github-sarif.mjs, and pulled rules from security/opengrep/. None of
# those exist here, so this version scans the whole repository with the published registry
# rule packs. On a small repository a full scan is cheap, and it removes three repository
# scripts from the adoption cost.
#
# This is the alternative to CodeQL for a private repository with no Advanced Security:
# it uploads SARIF only when the repository accepts it, and always keeps the raw report as
# a workflow artifact so findings are readable either way.
#
# The opengrep binary is pinned by version and by SHA256, exactly as OpenClaw pins it.
# Verify the digest before changing the version.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: opengrep-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Install opengrep
        env:
          # Pin the official Linux asset and its published digest. The upstream installer
          # validates tags through an unauthenticated GitHub API and can fail before
          # scanning even when this fixed release is available.
          OPENGREP_VERSION: v1.27.1
          OPENGREP_LINUX_X64_SHA256: 58053da76672bbeb5b0a5441021c58338707052e10f81d777140ca879bd491ce
        run: |
          set -euo pipefail
          binary="$(mktemp "${RUNNER_TEMP}/opengrep.XXXXXX")"
          trap 'rm -f "$binary"' EXIT
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 300 \
            -o "$binary" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          printf '%s  %s\n' "$OPENGREP_LINUX_X64_SHA256" "$binary" | sha256sum --check
          install_dir="${RUNNER_TEMP}/opengrep-bin"
          mkdir -p "$install_dir"
          install -m 0755 "$binary" "$install_dir/opengrep"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify opengrep
        run: opengrep --version

      - name: Run opengrep
        env:
          # Rule packs to run. Override with the OPENGREP_CONFIG repository variable.
          OPENGREP_CONFIG: ${{ vars.OPENGREP_CONFIG || 'p/default' }}
        run: |
          set -euo pipefail
          mkdir -p .opengrep-out
          # --error makes a finding fail the job. Remove it to run in report-only mode.
          opengrep scan \
            --config "$OPENGREP_CONFIG" \
            --sarif --output .opengrep-out/opengrep.sarif \
            --error \
            --metrics=off \
            .

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('.opengrep-out/opengrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: .opengrep-out/opengrep.sarif
          category: opengrep

      - name: Upload SARIF as workflow artifact
        if: always() && hashFiles('.opengrep-out/opengrep.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opengrep-sarif
          path: .opengrep-out/opengrep.sarif
          if-no-files-found: error
          retention-days: 30
