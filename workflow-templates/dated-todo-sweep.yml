name: Dated TODO Sweep

# Ported from openclaw/openclaw .github/workflows/dated-todo-sweep.yml.
# Made repository-neutral: the OpenClaw original runs scripts/dated-todo-scan.mts, then
# hands the result to openai/codex-action with .github/codex/prompts/dated-todo-sweep.md,
# then upserts a tracking issue. The Codex lane is dropped: it needs an OpenAI key in CI,
# and in this loop the agents run on the runner host, not in a GitHub Actions runner.
#
# What is kept is the useful half, with no repository script and no API key: scan the tree
# for dated TODO markers that are now past due, and keep one tracking issue up to date.
#
# Recognised forms, case insensitive:
#   TODO(2026-09-30): text          FIXME(2026-09-30): text
#   TODO 2026-09-30: text           TODO by 2026-09-30: text
#
# Runs as the triage identity (Ratatoskr) when RATATOSKR_APP_ID and RATATOSKR_PRIVATE_KEY
# are set, otherwise as github-actions[bot] via GITHUB_TOKEN.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log the report without creating or updating the tracking issue.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dated-todo-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Collect overdue dated TODO markers
        id: scan
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import pathlib
          import re
          import subprocess

          today = dt.date.today()
          pattern = re.compile(
            r"\b(TODO|FIXME)\b\s*(?:\(\s*(?:by\s+)?(\d{4}-\d{2}-\d{2})\s*\)|\s+(?:by\s+)?(\d{4}-\d{2}-\d{2}))\s*:?",
            re.IGNORECASE,
          )

          # git ls-files keeps the scan to tracked text files and honours .gitignore.
          tracked = subprocess.run(
            ["git", "ls-files", "-z"],
            check=True, capture_output=True,
          ).stdout.split(b"\0")

          overdue = []
          for raw in tracked:
            if not raw:
              continue
            path = pathlib.Path(raw.decode("utf-8", "replace"))
            try:
              text = path.read_text(encoding="utf-8")
            except (UnicodeDecodeError, OSError, IsADirectoryError):
              continue
            for number, line in enumerate(text.splitlines(), start=1):
              match = pattern.search(line)
              if not match:
                continue
              stamp = match.group(2) or match.group(3)
              try:
                due = dt.date.fromisoformat(stamp)
              except ValueError:
                continue
              if due <= today:
                overdue.append({
                  "path": str(path),
                  "line": number,
                  "due": stamp,
                  "days_overdue": (today - due).days,
                  "text": line.strip()[:200],
                })

          overdue.sort(key=lambda entry: (entry["due"], entry["path"], entry["line"]))
          pathlib.Path("dated-todo-report.json").write_text(json.dumps(overdue, indent=2))

          print(f"Found {len(overdue)} overdue dated TODO marker(s) as of {today.isoformat()}.")
          for entry in overdue:
            print(f"  {entry['path']}:{entry['line']} due {entry['due']} ({entry['days_overdue']} days)")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"count={len(overdue)}\n")
            handle.write(f"date={today.isoformat()}\n")
          PY

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        continue-on-error: true
        if: ${{ !inputs.dry_run }}
        with:
          app-id: ${{ vars.RATATOSKR_APP_ID }}
          private-key: ${{ secrets.RATATOSKR_PRIVATE_KEY }}
          permission-issues: write
          permission-metadata: read

      - name: Upsert the tracking issue
        if: ${{ !inputs.dry_run }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SWEEP_DATE: ${{ steps.scan.outputs.date }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs = require("node:fs");
            const overdue = JSON.parse(fs.readFileSync("dated-todo-report.json", "utf8"));
            const title = "Dated TODO sweep";
            const marker = "<!-- dated-todo-sweep -->";
            const sweepDate = process.env.SWEEP_DATE;
            const sha = context.sha;
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${sha}`;

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const tracking = existing.find(
              (issue) => !issue.pull_request && String(issue.body || "").includes(marker),
            );

            if (overdue.length === 0) {
              core.info("No overdue dated TODO markers.");
              if (tracking) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracking.number,
                  body: `${sweepDate}: no overdue dated TODO markers remain. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracking.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }

            const rows = overdue
              .map((entry) => {
                const link = `${base}/${entry.path}#L${entry.line}`;
                const text = String(entry.text).replace(/\|/g, "\\|");
                return `| [${entry.path}:${entry.line}](${link}) | ${entry.due} | ${entry.days_overdue} | \`${text}\` |`;
              })
              .join("\n");

            const body = [
              marker,
              `Swept ${sweepDate} at [${sha.slice(0, 12)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}).`,
              "",
              `${overdue.length} dated TODO marker(s) are past due.`,
              "",
              "| Location | Due | Days overdue | Line |",
              "| --- | --- | --- | --- |",
              rows,
              "",
              "This issue is rewritten by the Dated TODO Sweep workflow on every run.",
            ].join("\n");

            if (tracking) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracking.number,
                title,
                body,
              });
              core.info(`Updated tracking issue #${tracking.number}.`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info(`Created tracking issue #${created.data.number}.`);
