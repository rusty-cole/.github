name: Security Sensitive Guard

# Ported from openclaw/openclaw .github/workflows/security-sensitive-guard.yml.
# Made repository-neutral: the OpenClaw original ran scripts/github/security-sensitive-guard.mjs
# in detect and enforce modes against the openclaw-secops team and a named approver list.
# Neither exists here, so the script call is replaced with inline path matching.
#
# What this does: when a pull request touches a security-sensitive path, label it and
# require a human. In this loop that means the runner must not set merge_enabled for the
# item; a person reviews it. The sensitive path list is a repository variable so each
# repository can widen it without editing this workflow.
#
# pull_request is used, not pull_request_target: this job reads the file list through the
# API and never checks out or executes pull request code, so it needs no privileged context.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: security-sensitive-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-sensitive-guard:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      SECURITY_SENSITIVE_GLOBS: >-
        ${{ vars.SECURITY_SENSITIVE_GLOBS ||
        '.github/workflows/**,.github/actions/**,**/Dockerfile,**/*.pem,**/auth/**,**/secrets/**,**/security/**,**/credential*' }}
    steps:
      - name: Detect and enforce security-sensitive changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const globs = String(process.env.SECURITY_SENSITIVE_GLOBS || "")
              .split(",")
              .map((glob) => glob.trim())
              .filter(Boolean);

            // Minimal glob support: ** matches any characters including a slash,
            // * matches any characters except a slash, ? matches one non-slash character.
            function globToRegExp(glob) {
              let pattern = "";
              for (let index = 0; index < glob.length; index += 1) {
                const character = glob[index];
                if (character === "*") {
                  if (glob[index + 1] === "*") {
                    pattern += ".*";
                    index += 1;
                    if (glob[index + 1] === "/") {
                      index += 1;
                    }
                  } else {
                    pattern += "[^/]*";
                  }
                } else if (character === "?") {
                  pattern += "[^/]";
                } else if (".+^${}()|[]\\".includes(character)) {
                  pattern += `\\${character}`;
                } else {
                  pattern += character;
                }
              }
              return new RegExp(`^${pattern}$`);
            }

            const matchers = globs.map(globToRegExp);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            const sensitive = files
              .map((file) => file.filename)
              .filter((filename) => matchers.some((matcher) => matcher.test(filename)));

            const label = "security-sensitive";
            const hasLabel = (pullRequest.labels ?? []).some((entry) => entry.name === label);

            if (sensitive.length === 0) {
              if (hasLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  name: label,
                });
              }
              core.info("No security-sensitive paths changed.");
              await core.summary.addHeading("Security Sensitive Guard").addRaw("No sensitive paths changed.").write();
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error?.status !== 404) {
                throw error;
              }
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "b60205",
                description: "Touches a security-sensitive path; a human must review before merge.",
              });
            }

            if (!hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                labels: [label],
              });
            }

            const list = sensitive.map((filename) => `- \`${filename}\``).join("\n");
            await core.summary
              .addHeading("Security Sensitive Guard")
              .addRaw("This pull request changes security-sensitive paths and needs a human reviewer.")
              .addRaw(`\n\n${list}\n`)
              .write();

            core.setFailed(
              `This pull request changes ${sensitive.length} security-sensitive path(s). A human must review it; the runner must not auto-merge.`,
            );
