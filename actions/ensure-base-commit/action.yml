name: Ensure base commit
description: Ensure a shallow checkout has enough history to diff against a base SHA.

# Ported from openclaw/openclaw .github/actions/ensure-base-commit.
# Made repository-neutral: the OpenClaw original executes ../git-owner/owner.py with a
# sibling policy.py, a 600 line helper that is not being carried over. This version does
# the same job in plain git, which is all a diff-against-base needs.

inputs:
  base-sha:
    description: Base commit SHA to diff against.
    required: true
  fetch-ref:
    description: Branch or ref to deepen or fetch from origin when base-sha is missing.
    required: true
  max-deepen:
    description: Maximum number of deepen rounds before falling back to a full unshallow.
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - name: Ensure base commit is available
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        FETCH_REF: ${{ inputs.fetch-ref }}
        MAX_DEEPEN: ${{ inputs.max-deepen }}
      run: |
        set -euo pipefail

        if [ -z "$BASE_SHA" ]; then
          echo "::error::base-sha input is empty"
          exit 1
        fi

        have_base() {
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null
        }

        if have_base; then
          echo "Base commit $BASE_SHA is already present."
          exit 0
        fi

        echo "Base commit $BASE_SHA is missing; fetching."
        git fetch --no-tags --depth=1 origin "+${BASE_SHA}:refs/remotes/origin/base-commit" 2>/dev/null || true
        if have_base; then
          echo "Fetched the base commit directly."
          exit 0
        fi

        # Some servers refuse a fetch by SHA. Deepen the branch instead.
        attempt=0
        while [ "$attempt" -lt "$MAX_DEEPEN" ]; do
          attempt=$((attempt + 1))
          echo "Deepen round $attempt of $MAX_DEEPEN on $FETCH_REF."
          git fetch --no-tags --deepen=50 origin "+${FETCH_REF}:refs/remotes/origin/${FETCH_REF}" 2>/dev/null || true
          if have_base; then
            echo "Base commit found after $attempt deepen round(s)."
            exit 0
          fi
        done

        echo "Falling back to a full history fetch."
        git fetch --no-tags --unshallow origin 2>/dev/null || git fetch --no-tags origin
        if have_base; then
          echo "Base commit found after unshallow."
          exit 0
        fi

        echo "::error::Could not obtain base commit $BASE_SHA from origin/$FETCH_REF"
        exit 1
